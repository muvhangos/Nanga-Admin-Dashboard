<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nanga Primary School System</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
}

/* ================= LOGIN ================= */

.login-page{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:30px;
    width:350px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#1565c0;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:12px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1565c0;
    color:white;
    cursor:pointer;
    font-size:16px;
}

/* ================= APP ================= */

.app{
    display:none;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:250px;
    background:#0d47a1;
    color:white;
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo i{
    font-size:55px;
    margin-bottom:10px;
}

.logo h2{
    font-size:20px;
}

.menu button{
    width:100%;
    padding:15px;
    border:none;
    margin-bottom:10px;
    border-radius:12px;
    background:none;
    color:white;
    text-align:left;
    cursor:pointer;
    transition:0.3s;
}

.menu button:hover{
    background:rgba(255,255,255,0.2);
}

.menu i{
    margin-right:10px;
}

/* ================= MAIN ================= */

.main{
    margin-left:250px;
    padding:20px;
}

/* ================= TOPBAR ================= */

.topbar{
    background:white;
    padding:15px 20px;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

.topbar h1{
    color:#1565c0;
}

/* ================= CARDS ================= */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card i{
    font-size:35px;
    color:#1565c0;
    margin-bottom:15px;
}

/* ================= TABLE ================= */

.table-box{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#1565c0;
    color:white;
    padding:14px;
    text-align:left;
}

table td{
    padding:14px;
    border-bottom:1px solid #eee;
}

/* ================= FORMS ================= */

.form-box{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1565c0;
    color:white;
    cursor:pointer;
    font-size:16px;
}

/* ================= ACTION BUTTONS ================= */

.action-btn{
    border:none;
    padding:8px 12px;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.edit-btn{
    background:#1565c0;
}

.delete-btn{
    background:red;
}

/* ================= STATUS ================= */

.status{
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:12px;
}

.present{
    background:green;
}

.absent{
    background:red;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

.sidebar{
    position:relative;
    width:100%;
}

.main{
    margin-left:0;
}

.cards{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login-page"
id="loginPage">

    <div class="login-box">

        <h2>Nanga Primary School</h2>

        <input type="text"
        id="username"
        placeholder="Username">

        <input type="password"
        id="password"
        placeholder="Password">

        <button class="login-btn"
        onclick="login()">

            Login

        </button>

    </div>

</div>

<!-- ================= APP ================= -->

<div class="app"
id="app">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="logo">

            <i class="fas fa-school"></i>

            <h2>Nanga Primary School</h2>

        </div>

        <div class="menu">

            <button onclick="openSection('Dashboard')">
                <i class="fas fa-home"></i>
                Dashboard
            </button>

            <button onclick="openSection('Students')">
                <i class="fas fa-user-graduate"></i>
                Students
            </button>

            <button onclick="openSection('Teachers')">
                <i class="fas fa-chalkboard-teacher"></i>
                Teachers
            </button>

            <button onclick="openSection('Attendance')">
                <i class="fas fa-calendar-check"></i>
                Attendance
            </button>

            <button onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>

        </div>

    </div>

    <!-- ================= MAIN ================= -->

    <div class="main">

        <!-- ================= TOPBAR ================= -->

        <div class="topbar">

            <h1 id="pageTitle">
                Dashboard
            </h1>

            <div>

                <i class="fas fa-user-circle"></i>
                Admin

            </div>

        </div>

        <!-- ================= CARDS ================= -->

        <div class="cards">

            <div class="card">

                <i class="fas fa-user-graduate"></i>

                <h3 id="studentCount">
                    0 Students
                </h3>

            </div>

            <div class="card">

                <i class="fas fa-chalkboard-teacher"></i>

                <h3 id="teacherCount">
                    0 Teachers
                </h3>

            </div>

            <div class="card">

                <i class="fas fa-calendar-check"></i>

                <h3 id="attendanceCount">
                    0 Attendance
                </h3>

            </div>

        </div>

        <!-- ================= STUDENTS ================= -->

        <div class="table-box">

            <h2>Students</h2>

            <table>

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Grade</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable"></tbody>

            </table>

        </div>

        <div class="form-box">

            <h2>Add Student</h2>

            <div class="form-group">

                <label>Student Name</label>

                <input type="text"
                id="studentName">

            </div>

            <div class="form-group">

                <label>Grade</label>

                <select id="studentGrade">

                    <option>Grade 1</option>
                    <option>Grade 2</option>
                    <option>Grade 3</option>
                    <option>Grade 4</option>
                    <option>Grade 5</option>
                    <option>Grade 6</option>
                    <option>Grade 7</option>

                </select>

            </div>

            <button class="submit-btn"
            onclick="addStudent()">

                Add Student

            </button>

        </div>

        <!-- ================= TEACHERS ================= -->

        <div class="table-box">

            <h2>Teachers</h2>

            <table>

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Subject</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="teacherTable"></tbody>

            </table>

        </div>

        <div class="form-box">

            <h2>Add Teacher</h2>

            <div class="form-group">

                <label>Teacher Name</label>

                <input type="text"
                id="teacherName">

            </div>

            <div class="form-group">

                <label>Subject</label>

                <input type="text"
                id="teacherSubject">

            </div>

            <button class="submit-btn"
            onclick="addTeacher()">

                Add Teacher

            </button>

        </div>

        <!-- ================= ATTENDANCE ================= -->

        <div class="table-box">

            <h2>Attendance</h2>

            <table>

                <thead>

                    <tr>

                        <th>Student</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="attendanceTable"></tbody>

            </table>

        </div>

        <div class="form-box">

            <h2>Add Attendance</h2>

            <div class="form-group">

                <label>Student Name</label>

                <input type="text"
                id="attendanceStudent">

            </div>

            <div class="form-group">

                <label>Status</label>

                <select id="attendanceStatus">

                    <option>Present</option>
                    <option>Absent</option>

                </select>

            </div>

            <button class="submit-btn"
            onclick="addAttendance()">

                Save Attendance

            </button>

        </div>

    </div>

</div>

<!-- ================= JAVASCRIPT ================= -->

<script>

/* ================= LOGIN ================= */

function login(){

    const username =
    document.getElementById(
        "username"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    if(
        username === "admin"
        &&
        password === "1234"
    ){

        document.getElementById(
            "loginPage"
        ).style.display = "none";

        document.getElementById(
            "app"
        ).style.display = "block";

        alert(
            "Login Successful"
        );

    }

    else{

        alert(
            "Invalid Login"
        );

    }

}

/* ================= LOGOUT ================= */

function logout(){

    location.reload();

}

/* ================= OPEN SECTION ================= */

function openSection(name){

    document.getElementById(
        "pageTitle"
    ).innerText = name;

    alert(name + " Opened");

}

/* ================= COUNTERS ================= */

let studentCounter = 0;
let teacherCounter = 0;
let attendanceCounter = 0;

function updateCounters(){

    document.getElementById(
        "studentCount"
    ).innerText =
    studentCounter + " Students";

    document.getElementById(
        "teacherCount"
    ).innerText =
    teacherCounter + " Teachers";

    document.getElementById(
        "attendanceCount"
    ).innerText =
    attendanceCounter + " Attendance";

}

/* ================= STUDENTS ================= */

function addStudent(){

    const name =
    document.getElementById(
        "studentName"
    ).value;

    const grade =
    document.getElementById(
        "studentGrade"
    ).value;

    if(name === ""){

        alert("Enter student name");

        return;

    }

    const table =
    document.getElementById(
        "studentTable"
    );

    table.innerHTML +=
    `
    <tr>

        <td>${name}</td>

        <td>${grade}</td>

        <td>

            <button class="action-btn edit-btn"
            onclick="editStudent(this)">
                Edit
            </button>

            <button class="action-btn delete-btn"
            onclick="deleteRow(this,'student')">
                Delete
            </button>

        </td>

    </tr>
    `;

    studentCounter++;

    updateCounters();

    document.getElementById(
        "studentName"
    ).value = "";

}

/* ================= EDIT STUDENT ================= */

function editStudent(button){

    const row =
    button.parentElement.parentElement;

    const currentName =
    row.cells[0].innerText;

    const newName =
    prompt(
        "Edit Student Name",
        currentName
    );

    if(newName){

        row.cells[0].innerText =
        newName;

    }

}

/* ================= TEACHERS ================= */

function addTeacher(){

    const name =
    document.getElementById(
        "teacherName"
    ).value;

    const subject =
    document.getElementById(
        "teacherSubject"
    ).value;

    if(name === "" || subject === ""){

        alert("Fill all fields");

        return;

    }

    const table =
    document.getElementById(
        "teacherTable"
    );

    table.innerHTML +=
    `
    <tr>

        <td>${name}</td>

        <td>${subject}</td>

        <td>

            <button class="action-btn edit-btn"
            onclick="editTeacher(this)">
                Edit
            </button>

            <button class="action-btn delete-btn"
            onclick="deleteRow(this,'teacher')">
                Delete
            </button>

        </td>

    </tr>
    `;

    teacherCounter++;

    updateCounters();

    document.getElementById(
        "teacherName"
    ).value = "";

    document.getElementById(
        "teacherSubject"
    ).value = "";

}

/* ================= EDIT TEACHER ================= */

function editTeacher(button){

    const row =
    button.parentElement.parentElement;

    const currentName =
    row.cells[0].innerText;

    const currentSubject =
    row.cells[1].innerText;

    const newName =
    prompt(
        "Edit Teacher Name",
        currentName
    );

    const newSubject =
    prompt(
        "Edit Subject",
        currentSubject
    );

    if(newName && newSubject){

        row.cells[0].innerText =
        newName;

        row.cells[1].innerText =
        newSubject;

    }

}

/* ================= ATTENDANCE ================= */

function addAttendance(){

    const student =
    document.getElementById(
        "attendanceStudent"
    ).value;

    const status =
    document.getElementById(
        "attendanceStatus"
    ).value;

    if(student === ""){

        alert("Enter student name");

        return;

    }

    const statusClass =
    status === "Present"
    ?
    "present"
    :
    "absent";

    const table =
    document.getElementById(
        "attendanceTable"
    );

    table.innerHTML +=
    `
    <tr>

        <td>${student}</td>

        <td>
            <span class="status ${statusClass}">
                ${status}
            </span>
        </td>

        <td>

            <button class="action-btn edit-btn"
            onclick="editAttendance(this)">
                Edit
            </button>

            <button class="action-btn delete-btn"
            onclick="deleteRow(this,'attendance')">
                Delete
            </button>

        </td>

    </tr>
    `;

    attendanceCounter++;

    updateCounters();

    document.getElementById(
        "attendanceStudent"
    ).value = "";

}

/* ================= EDIT ATTENDANCE ================= */

function editAttendance(button){

    const row =
    button.parentElement.parentElement;

    const currentName =
    row.cells[0].innerText;

    const newName =
    prompt(
        "Edit Student Name",
        currentName
    );

    if(newName){

        row.cells[0].innerText =
        newName;

    }

}

/* ================= DELETE ================= */

function deleteRow(button,type){

    const row =
    button.parentElement.parentElement;

    if(confirm("Delete Record?")){

        row.remove();

        if(type === "student"){

            studentCounter--;

        }

        else if(type === "teacher"){

            teacherCounter--;

        }

        else if(type === "attendance"){

            attendanceCounter--;

        }

        updateCounters();

    }

}

</script>

</body>
</html>
